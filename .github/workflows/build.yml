name: Build FarmBuilder

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only needed so tagged builds can publish a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check mixin targets exist in the original classes
        run: python3 tools/check_mixin_targets.py

      # Schematic converter is plain Java: test it first (fast, no Minecraft download).
      - name: Test schematic converter (.litematic / .schem / .nbt)
        run: python3 tools/run_schem_tests.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'   # same Gradle the original jar was built with

      - name: Build mod jar
        run: gradle build --no-daemon --stacktrace

      - name: Verify jar contents
        run: |
          JAR=$(ls build/dist/FarmBuilder-*.jar)
          echo "Built: $JAR ($(du -h "$JAR" | cut -f1))"
          unzip -l "$JAR" > contents.txt
          fail=0
          need() { grep -q "$1" contents.txt && echo "  ok   $1" || { echo "  MISSING $1"; fail=1; }; }
          need 'fabric.mod.json'
          need 'farmbuilder.mixins.json'
          need 'com/farmbuilder/FarmBuilderClient.class'
          need 'com/farmbuilder/build/AutoBuildCore.class'
          need 'com/farmbuilder/ext/FarmBuilderExt.class'
          need 'com/farmbuilder/ext/CreativeSupply.class'
          need 'com/farmbuilder/ext/schem/SchematicConverter.class'
          need 'com/farmbuilder/mixin/AutoBuildCoreMixin.class'
          need 'com/farmbuilder/mixin/ClientPlayerEntityMixin.class'
          need 'farms/32.json'
          need 'farms/64.json'
          need 'META-INF/jars/baritone-api-fabric-1.15.0.jar'
          CLASSES=$(grep -c '\.class$' contents.txt)
          echo "  classes in jar: $CLASSES (original 41 + new code)"
          [ "$CLASSES" -ge 55 ] || { echo "  too few classes"; fail=1; }
          exit $fail

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: FarmBuilder
          path: build/dist/FarmBuilder-*.jar
          if-no-files-found: error

      - name: Publish release (tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/FarmBuilder-*.jar
          generate_release_notes: true
